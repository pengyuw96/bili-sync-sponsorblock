# Example NAS deployment — bili-sync-sponsorblock. NOT deployed automatically.
# Canonical in-container media path: /bili-sync
# Single media mount. DB source paths were migrated /media/bili-sync -> /bili-sync
# on 2026-10-12 (backup next to data.sqlite).
services:
  bili-sync-sponsorblock:
    image: bili-sync-sponsorblock:3.1.5.1
    container_name: bili-sync-sponsorblock
    restart: unless-stopped
    user: "<UID>:<GID>"
    ports:
      - "12346:12345"
    volumes:
      - /path/to/bili-sync/config:/app/.config/bili-sync
      - /path/to/media/bili-sync:/bili-sync
    environment:
      - TZ=Asia/Shanghai
      - RUST_LOG=None,bili_sync=info
    logging:
      driver: "local"
